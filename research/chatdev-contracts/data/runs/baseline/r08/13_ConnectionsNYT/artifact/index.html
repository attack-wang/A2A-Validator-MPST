<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Word Grid — Group the 16 Words</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Word Grid</h1>
      <p class="subtitle">Group the 16 words into 4 hidden categories</p>
      <p class="puzzle-meta">Puzzle #<span id="puzzle-number"></span> · <span id="puzzle-date"></span></p>
    </header>
    <section id="solved-groups" aria-live="polite"></section>
    <section id="grid" class="grid" aria-label="Word grid"></section>
    <p id="message" class="message" role="status" aria-live="polite"></p>
    <div class="mistakes">
      <span>Mistakes remaining:</span>
      <span id="mistake-dots" class="dots"></span>
    </div>
    <div class="controls">
      <button id="shuffle-btn" class="btn secondary">Shuffle</button>
      <button id="deselect-btn" class="btn secondary">Deselect all</button>
      <button id="submit-btn" class="btn primary" disabled>Submit</button>
    </div>
    <section id="game-over" class="game-over hidden">
      <h2 id="game-over-title"></h2>
      <p id="game-over-text"></p>
      <p class="next-in">Next puzzle in <span id="countdown"></span></p>
    </section>
    <footer>
      <p>Find 4 groups of 4 related words. Be careful — some words fit more than one category!</p>
    </footer>
  </main>
  <script src="puzzles.js"></script>
  <script src="game.js"></script>
</body>
</html>
