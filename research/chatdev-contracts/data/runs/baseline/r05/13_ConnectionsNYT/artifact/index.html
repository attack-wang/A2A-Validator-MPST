<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Word Groups</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-wrapper">
    <header class="game-header">
      <h1 class="game-title">Word Groups</h1>
      <p class="game-subtitle">Create four groups of four</p>
      <p class="puzzle-meta">
        <span id="puzzle-number">Puzzle #1</span> · <span id="puzzle-date">Jan 1, 2024</span>
      </p>
    </header>
    <section id="solved-groups" class="solved-groups" aria-live="polite"></section>
    <section class="board-area">
      <div id="selection-row" class="selection-row"></div>
      <div id="grid" class="grid"></div>
    </section>
    <section class="mistakes-area">
      <span class="mistakes-label">Mistakes remaining:</span>
      <div id="mistakes-dots" class="mistakes-dots"></div>
    </section>
    <section class="controls">
      <button id="shuffle-btn" class="btn btn-secondary">Shuffle</button>
      <button id="deselect-btn" class="btn btn-secondary">Deselect all</button>
      <button id="submit-btn" class="btn btn-primary" disabled>Submit</button>
    </section>
    <footer class="game-footer">
      <p>A new puzzle is available every day. Come back tomorrow!</p>
    </footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="assertive"></div>
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="modal-title"></h2>
      <p id="modal-message"></p>
      <div id="modal-results"></div>
      <div class="modal-actions">
        <button id="modal-share-btn" class="btn btn-primary">Copy Result</button>
        <button id="modal-close-btn" class="btn btn-secondary">Play on / Close</button>
      </div>
    </div>
  </div>
  <script src="puzzles.js"></script>
  <script src="game.js"></script>
</body>
</html>
