<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Connections — Daily Puzzle</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
  <header>
    <h1>Word Connections</h1>
    <p class="subtitle">Group sixteen words into four hidden categories</p>
    <div class="puzzle-meta">
      <span id="puzzle-date"></span>
      <span id="puzzle-number"></span>
    </div>
  </header>
  <div id="solved-groups" class="solved-groups"></div>
  <div id="message-banner" class="message-banner" role="status"></div>
  <div id="grid" class="grid" aria-label="Word grid"></div>
  <div class="mistakes-row">
    <span class="mistakes-label">Mistakes remaining:</span>
    <div id="mistakes" class="mistakes"></div>
  </div>
  <div class="controls">
    <button id="shuffle-btn" class="btn secondary">Shuffle</button>
    <button id="deselect-btn" class="btn secondary">Deselect all</button>
    <button id="submit-btn" class="btn primary" disabled>Submit</button>
  </div>
  <div class="footer">
    <button id="view-results-btn" class="btn link hidden">View results</button>
    <button id="reset-btn" class="btn link">Restart puzzle</button>
  </div>
</div>
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="modal-title"></h2>
    <p id="modal-message"></p>
    <div id="emoji-grid" class="emoji-grid"></div>
    <div id="modal-groups" class="modal-groups"></div>
    <div id="stats" class="stats"></div>
    <div id="countdown" class="countdown"></div>
    <button id="modal-close" class="btn primary">Close</button>
  </div>
</div>
<script src="puzzles.js"></script>
<script src="game.js"></script>
<script src="main.js"></script>
</body>
</html>
