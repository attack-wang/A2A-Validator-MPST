<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Word Groups</title>
<style>...</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Daily Word Groups</h1>
    <p class="subtitle">Group the 16 words into 4 hidden categories of 4</p>
  </header>
  <div class="puzzle-info">
    <span id="puzzle-date"></span>
    <span id="puzzle-number"></span>
  </div>
  <div class="mistakes-row">
    <span>Mistakes remaining:</span>
    <div id="mistake-dots"></div>
  </div>
  <div id="solved-groups"></div>
  <div id="grid"></div>
  <div class="toast" id="toast"></div>
  <div class="controls">
    <button id="shuffle-btn">Shuffle</button>
    <button id="deselect-btn">Deselect all</button>
    <button id="submit-btn">Submit</button>
  </div>
</div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title"></h2>
    <p id="modal-message"></p>
    <div id="modal-results"></div>
    <button id="modal-close">Play again tomorrow</button>
  </div>
</div>
<script>...</script>
</body>
</html>
