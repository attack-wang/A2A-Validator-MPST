<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordWeave — Daily Word Grouping Puzzle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>WordWeave</h1>
      <p class="subtitle">Group sixteen words into four hidden categories</p>
      <div class="puzzle-meta">
        <span id="puzzle-number"></span>
        <span id="puzzle-date"></span>
      </div>
    </header>
    <section class="how-to">
      <button id="how-to-toggle" ...>How to Play ▾</button>
      <div id="how-to-panel" hidden> ... rules ... </div>
    </section>
    <section class="status-bar">
      <span class="mistakes-label">Mistakes remaining:</span>
      <div id="mistake-dots" class="mistake-dots"></div>
    </section>
    <main>
      <div id="solved-groups"></div>
      <div id="grid" class="grid"></div>
    </main>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <section class="controls">
      <button id="shuffle-btn" class="btn secondary">Shuffle</button>
      <button id="deselect-btn" class="btn secondary">Deselect All</button>
      <button id="submit-btn" class="btn primary" disabled>Submit</button>
    </section>
    <footer>...</footer>
  </div>
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="modal-title"></h2>
      <p id="modal-subtitle"></p>
      <div id="modal-results"></div>
      <div class="modal-actions">
        <button id="copy-result-btn" class="btn secondary">Copy Result</button>
        <button id="close-modal-btn" class="btn primary">Close</button>
      </div>
    </div>
  </div>
  <script src="puzzles.js"></script>
  <script src="daily.js"></script>
  <script src="game.js"></script>
  <script src="ui.js"></script>
  <script src="main.js"></script>
</body>
</html>
