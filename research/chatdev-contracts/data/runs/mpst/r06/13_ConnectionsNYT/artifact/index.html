<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Weave — Daily Word Grouping Puzzle</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="title">WORD WEAVE</h1>
      <p class="subtitle">Group the sixteen words into four hidden categories.</p>
      <div class="puzzle-meta">
        <span id="puzzle-date"></span>
        <span id="puzzle-number"></span>
      </div>
    </header>
    <section id="solved-groups" class="solved-groups"></section>
    <section id="grid" class="grid" aria-label="Word grid"></section>
    <section class="mistakes-row">
      <span class="mistakes-label">Mistakes remaining:</span>
      <div id="mistakes" class="mistakes"></div>
    </section>
    <section class="controls">
      <button id="shuffle-btn" class="btn btn-secondary">Shuffle</button>
      <button id="deselect-btn" class="btn btn-secondary">Deselect all</button>
      <button id="submit-btn" class="btn btn-primary" disabled>Submit</button>
    </section>
    <div id="toast" class="toast hidden"></div>
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal">
        <h2 id="modal-title"></h2>
        <p id="modal-message"></p>
        <div id="modal-grid" class="emoji-grid"></div>
        <div class="modal-actions">
          <button id="share-btn" class="btn btn-primary">Share result</button>
          <button id="play-again-btn" class="btn btn-secondary">Close</button>
        </div>
      </div>
    </div>
    <footer class="footer">
      <button id="help-btn" class="link-btn">How to play</button>
    </footer>
  </div>
  <div id="help-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h2>How to play</h2>
      <ul>...</ul>
      <button id="close-help-btn" class="btn btn-primary">Got it</button>
    </div>
  </div>
  <script src="puzzles.js"></script>
  <script src="game.js"></script>
  <script src="ui.js"></script>
  <script src="main.js"></script>
</body>
</html>
