<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Word Groups — A Word Connection Puzzle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Daily Word Groups</h1>
      <p class="subtitle">Group the 16 words into 4 hidden categories</p>
      <p class="date" id="puzzle-date"></p>
    </header>
    <section id="solved-groups"></section>
    <section class="mistakes-bar">
      <span>Mistakes remaining:</span>
      <div id="mistake-dots"></div>
    </section>
    <main id="grid" class="grid"></main>
    <section class="controls">
      <button id="shuffle-btn">Shuffle</button>
      <button id="deselect-btn">Deselect all</button>
      <button id="submit-btn" disabled>Submit</button>
    </section>
    <section class="message" id="message"></section>
    <footer>
      <button id="new-game-btn">Play random puzzle</button>
      <p class="how-to">...</p>
    </footer>
  </div>
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
      <div id="modal-groups"></div>
      <button id="modal-btn"></button>
    </div>
  </div>
  <script src="puzzles.js"></script>
  <script src="game.js"></script>
  <script src="ui.js"></script>
  <script src="main.js"></script>
</body>
</html>
