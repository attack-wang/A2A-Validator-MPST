[project]
name = "mpst-a2a-host-ui"
version = "0.1.0"
description = "Agent2Agent example UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncio>=3.4.3",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.0",
    "pydantic==2.11.10",
    "fastapi==0.123.10",
    "uvicorn==0.40.0",
    "mesop==1.2.0",
    "a2a-sdk==0.3.22",
    "pandas==2.3.3",
    "numpy>=2.2,<2.4",
    "google-genai==1.57.0",
    "google-adk[a2a]==1.22.0",
    "litellm==1.80.13",
    "opentelemetry-exporter-gcp-logging==1.11.0a0",
    "opentelemetry-exporter-gcp-monitoring==1.11.0a0",
    "opentelemetry-resourcedetector-gcp==1.11.0a0",
    "mpst-a2a-orchestrator",
]

[tool.hatch.build.targets.wheel]
packages = ["a2a_ui"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
a2a_ui = { workspace = true }
mpst-a2a-orchestrator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff==0.14.11"]
