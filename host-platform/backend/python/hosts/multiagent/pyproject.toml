[project]
name = "mpst-a2a-orchestrator"
version = "0.1.0"
description = "Google ADK-based host agent that can communicate with other agents over the A2A protocol."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk==0.3.22",
    "google-genai==1.57.0",
    "google-adk==1.22.0",
    "mpst-a2a-timestamp-extension",
    "mpst-ext",
    "antlr4-python3-runtime~=4.9.2",
    "litellm==1.80.13",
]

[tool.uv.sources]
mpst-a2a-timestamp-extension = { workspace = true }
mpst-ext = { path = "../../../../../mpst-runtime/mpst_ext", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["."]
# 确保 workflows.json 随包安装，避免 wheel 内缺文件导致工作流为空
force-include = { "workflows.json" = "workflows.json" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
