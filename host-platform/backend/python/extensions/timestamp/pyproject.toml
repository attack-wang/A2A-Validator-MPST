[project]
name = "mpst-a2a-timestamp-extension"
version = "0.1.0"
description = "Hello world A2A extension impl"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["a2a-sdk==0.3.22"]

[tool.hatch.build.targets.wheel]
packages = ["src/timestamp_ext"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
