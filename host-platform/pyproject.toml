[project]
name = "mpst-a2a-host-platform"
version = "0.1.0"
description = "Host platform for MPST-validated A2A multi-agent communication."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "antlr4-python3-runtime~=4.9.2",
]

[tool.uv.workspace]
members = [
    "backend/python/hosts/multiagent",
    "backend/python/extensions/timestamp",
    "frontend/ui",
]
