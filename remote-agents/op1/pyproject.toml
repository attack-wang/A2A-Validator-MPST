[project]
name = "mpst-a2a-op1-agent"
version = "0.1.0"
description = "Sample Google ADK-based Operation 1 agent hosted as an A2A server."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk>=0.3.0",
    "click>=8.1.8",
    "google-adk>=1.8.0",
    "google-genai>=1.27.0",
    "python-dotenv>=1.1.0",
    "litellm",
    "mpst-ext",
]

[tool.uv.sources]
mpst-ext = { path = "../../mpst-runtime/mpst_ext", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
