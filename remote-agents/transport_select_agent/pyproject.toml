[project]
name = "mpst-a2a-transport-select-agent"
version = "0.1.0"
description = "Travel transport-selection A2A agent with optional MPST validation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk>=0.3.0",
    "click>=8.1.8",
    "google-adk>=1.8.0",
    "google-genai>=1.27.0",
    "python-dotenv>=1.1.0",
    "litellm",
    "mpst-a2a-timestamp-extension",
    "mpst-ext",
]

[tool.uv.sources]
mpst-a2a-timestamp-extension = { path = "../../host-platform/backend/python/extensions/timestamp", editable = true }
mpst-ext = { path = "../../mpst-runtime/mpst_ext", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
